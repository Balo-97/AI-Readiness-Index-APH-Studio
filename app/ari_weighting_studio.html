<title>ARI Weighting Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#F2F4F3; --surface:#FFFFFF; --surface-2:#EBEFED; --surface-3:#E1E7E4;
  --ink:#16201D; --ink-2:#34423D; --muted:#5F6D68; --line:#D2DBD7; --line-2:#E3E8E5;
  --accent:#2B4A85; --accent-ink:#FFFFFF; --accent-soft:#E2E8F4; --accent-line:#B7C5E2;
  --supply:#177F8B; --supply-soft:#DCEFF1; --demand:#9C4692; --demand-soft:#F4E2F1; --context:#6D7249; --context-soft:#ECEEDF;
  --ok:#2A7443; --ok-soft:#DFF0E3; --warn:#8F5600; --warn-soft:#FAEDD6; --bad:#B42318; --bad-soft:#FBE3E0;
  --shadow:0 1px 2px rgba(18,32,28,.06),0 6px 20px rgba(18,32,28,.05);
  --r:10px; --r-s:6px;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-cond:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",var(--font-ui);
  --font-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --b11:#e8e8e8; --b12:#ace4e4; --b13:#5ac8c8; --b21:#dfb0d6; --b22:#a5add3; --b23:#5698b9; --b31:#be64ac; --b32:#8c62aa; --b33:#3b4994;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1312; --surface:#161C1B; --surface-2:#1C2422; --surface-3:#25302D;
    --ink:#E3EAE7; --ink-2:#C3CDC9; --muted:#8F9C97; --line:#2C3633; --line-2:#222B29;
    --accent:#93AEE6; --accent-ink:#0E1312; --accent-soft:#1E2940; --accent-line:#3A4D75;
    --supply:#52BBC7; --supply-soft:#12303A; --demand:#D38DCA; --demand-soft:#382036; --context:#B8BC8E; --context-soft:#2A2C1F;
    --ok:#72C58F; --ok-soft:#15301F; --warn:#E6A94E; --warn-soft:#382810; --bad:#F38A7E; --bad-soft:#3C1A16;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1312; --surface:#161C1B; --surface-2:#1C2422; --surface-3:#25302D;
  --ink:#E3EAE7; --ink-2:#C3CDC9; --muted:#8F9C97; --line:#2C3633; --line-2:#222B29;
  --accent:#93AEE6; --accent-ink:#0E1312; --accent-soft:#1E2940; --accent-line:#3A4D75;
  --supply:#52BBC7; --supply-soft:#12303A; --demand:#D38DCA; --demand-soft:#382036; --context:#B8BC8E; --context-soft:#2A2C1F;
  --ok:#72C58F; --ok-soft:#15301F; --warn:#E6A94E; --warn-soft:#382810; --bad:#F38A7E; --bad-soft:#3C1A16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-cond);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:1.3rem} h3{font-size:1.05rem} h4{font-size:.95rem}
p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--font-mono);font-size:.9em}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.9em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-family:var(--font-cond);font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.25rem;overflow-wrap:anywhere}
.top-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.me-picker{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);white-space:nowrap}
.me-picker select{min-width:170px;max-width:240px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.shared .dot{background:var(--ok)} .chip.demo .dot{background:var(--warn)} .chip.local .dot{background:var(--accent)}

.tabsbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px 10px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--font-mono);font-size:.75rem;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tabs .count.done{background:var(--ok-soft);color:var(--ok)}

main.wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.banner{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.banner .txt{max-width:75ch}
.banner .acts{display:flex;flex-wrap:wrap;gap:8px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px clamp(14px,2vw,22px)}
.panel.flat{background:transparent;border-style:dashed}
.shead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.shead .meta{color:var(--muted);font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
.hint{font-size:.8rem;color:var(--muted)}

input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 9px;min-width:0;width:100%}
input:disabled,select:disabled{opacity:.6}
textarea{resize:vertical;min-height:64px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-s);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:7px 13px;font-weight:500;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--surface-2);filter:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.danger{background:var(--surface);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.icon-btn{border:1px solid transparent;background:transparent;border-radius:var(--r-s);width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.armed{background:var(--bad);color:#fff}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.S{background:var(--supply-soft);color:var(--supply)} .pill.D{background:var(--demand-soft);color:var(--demand)} .pill.C{background:var(--context-soft);color:var(--context)}

/* setup lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden}
.lrow{display:grid;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line-2);background:var(--surface)}
.lrow:first-child{border-top:0}
.lrow.head{background:var(--surface-2);font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding-block:6px}
.dimrow{grid-template-columns:28px minmax(140px,1fr) minmax(160px,2fr) auto}
.indrow{grid-template-columns:minmax(150px,2fr) 116px 150px minmax(120px,1.3fr) minmax(110px,1.2fr) minmax(110px,1fr) auto}
.lrow .idx{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);text-align:right}
.acts3{display:flex;gap:2px;justify-content:flex-end}
.dimblock{display:flex;flex-direction:column;gap:8px}
.dimblock+.dimblock{margin-top:14px}
.dimblock .dh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
@media (max-width:980px){
  .indrow{grid-template-columns:1fr 1fr}
  .indrow>.nm{grid-column:1/-1}
  .indrow>.acts3{grid-column:1/-1}
  .lrow.head.indrow{display:none}
  .dimrow{grid-template-columns:28px 1fr auto}
  .dimrow>.ds{grid-column:2/3}
  .lrow.head.dimrow{display:none}
}
.catalog{border:1px solid var(--accent-line);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface));border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:10px}
.catlist{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.catitem{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:8px 10px;border-top:1px solid var(--line-2);align-items:start;cursor:pointer}
.catitem:first-child{border-top:0}
.catitem:hover{background:var(--surface-2)}
.catgroup{padding:6px 10px;background:var(--surface-2);font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);position:sticky;top:0}

/* compare */
.compare{display:grid;grid-template-columns:230px minmax(0,1fr) 310px;gap:18px;align-items:start}
.mnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:64px}
.mnav button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--r-s);padding:8px 10px;cursor:pointer}
.mnav button:hover{background:var(--surface)}
.mnav button[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.mnav .mt{font-weight:500;font-size:.92rem}
.mnav .ms{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.mnav .lvl{margin:10px 10px 4px}
.mselect{display:none}
.bar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.ok>i{background:var(--ok)}
.mside{position:sticky;top:64px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1180px){
  .compare{grid-template-columns:minmax(0,1fr) 290px}
  .mnav{display:none}
  .mselect{display:block;grid-column:1/-1}
}
@media (max-width:860px){
  .compare{grid-template-columns:minmax(0,1fr)}
  .mside{position:static}
}
.pairs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pair.todo{border-left:3px solid var(--warn)}
.pair.flag{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
.pnames{display:flex;justify-content:space-between;gap:12px;font-weight:500}
.pnames .b{text-align:right}
.pnames .vs{color:var(--muted);font-size:.8rem;font-weight:400;align-self:center}
.scale{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));gap:2px}
.scale button{height:34px;border:1px solid var(--line-2);border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:.82rem;padding:0;color:var(--ink-2);background:color-mix(in srgb,var(--accent) calc(var(--k)*30%),var(--surface))}
.scale button.se{background:var(--surface-2);font-weight:600}
.scale button:hover{border-color:var(--accent)}
.scale button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.readout{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.readout b{color:var(--ink);font-weight:500}
.scalehead{display:grid;grid-template-columns:1fr auto 1fr;font-size:.75rem;color:var(--muted);padding:0 12px}
.scalehead span:last-child{text-align:right}
@media (max-width:520px){.scale button{height:30px;font-size:.7rem}}

.wbars{display:flex;flex-direction:column;gap:7px}
.wbar{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 8px;align-items:center;font-size:.86rem}
.wbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbar .v{text-align:right}
.wbar .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.wbar .track>i{display:block;height:100%;background:var(--accent)}
.wbar.S .track>i{background:var(--supply)} .wbar.D .track>i{background:var(--demand)} .wbar.C .track>i{background:var(--context)}
.crbox{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.fixes{display:flex;flex-direction:column;gap:8px}
.fix{border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;font-size:.85rem;display:flex;flex-direction:column;gap:6px}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r-s)}
table.data{border-collapse:collapse;width:100%;font-size:.88rem}
table.data th,table.data td{padding:7px 10px;border-top:1px solid var(--line-2);text-align:left;vertical-align:middle}
table.data thead th{border-top:0;background:var(--surface-2);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;white-space:nowrap}
table.data td.r,table.data th.r{text-align:right}
table.data tr.grp td{background:var(--surface-2);font-weight:600;font-family:var(--font-cond)}
table.data tr.hl td{background:var(--accent-soft)}
table.data th.sortable{cursor:pointer}
table.data th.sortable:hover{color:var(--ink)}
.cellbar{display:flex;align-items:center;gap:8px;min-width:120px}
.cellbar .t{flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:40px}
.cellbar .t>i{display:block;height:100%}
.matrix td,.matrix th{text-align:center!important;font-family:var(--font-mono);font-size:.8rem}
.matrix td.diag{color:var(--muted)}

details.acc{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
details.acc+details.acc{margin-top:8px}
details.acc>summary{cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.acc[open]>summary::before{transform:rotate(45deg)}
details.acc>summary .t{font-weight:600;font-family:var(--font-cond);font-size:1rem}
details.acc .body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line-2);border-radius:var(--r-s);padding:10px 12px;background:var(--surface)}
.stat .k{font-size:.75rem;color:var(--muted)}
.stat .v{font-family:var(--font-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.chartwrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:start}
@media (max-width:820px){.chartwrap{grid-template-columns:1fr}}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--font-ui);font-size:11px}
svg.chart .grid{stroke:var(--line-2)}
svg.chart .axis{stroke:var(--line)}
svg.chart .guide{stroke:var(--muted);stroke-dasharray:4 4;opacity:.7}
svg.chart circle.pt{stroke:var(--surface);stroke-width:.8;cursor:pointer}
svg.chart circle.pt:hover,svg.chart circle.pt.sel{stroke:var(--ink);stroke-width:1.6}
.biv{display:grid;grid-template-columns:auto repeat(3,28px);grid-template-rows:repeat(3,28px) auto;gap:2px;font-size:.72rem;color:var(--muted);align-items:center}
.biv i{display:block;width:28px;height:28px;border-radius:3px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:15;width:min(500px,100vw);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(18,32,28,.12);padding:16px 18px 32px}
.drawer:focus{outline:none}
.dg-heat td,.dg-heat th{white-space:nowrap}.dg-heat td:first-child{white-space:normal;min-width:220px}
.dg-heat tr.grp td{font-family:var(--font-cond);font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.dg-grid td{min-width:84px;line-height:1.15}.dg-grid td .n{display:block;font-size:.7rem;opacity:.75}.dg-grid th[scope=row]{text-align:left;font-weight:500}
.dg-grid td.small-cell{color:var(--muted);font-style:italic;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--surface-2) 5px 7px)}
.dg-defs{display:grid;gap:12px;margin-top:6px}.dg-def{border:1px solid var(--line-2);border-radius:var(--r-s);padding:10px 12px}
svg.dg-dots{max-width:none}
.rlegend .lk.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);border:0}.rlegend .lk.band{height:8px;border-radius:4px;background:var(--accent-line);border:0}.rlegend .lk.tick{width:2px;height:12px;background:var(--ink-2);border:0}
details.dg-more>summary{cursor:pointer;color:var(--accent);font-size:.9rem}
.banner.imp{display:block}.banner.imp .imp-h{font-size:1.05rem;margin:0 0 2px}.banner.imp .tscroll{margin-top:10px;background:var(--surface)}
.imp-table td{vertical-align:top}.imp-table tr.skip td:not(:last-child){opacity:.55}
.imp-warn{margin-top:10px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft);border-radius:var(--r-s);font-size:.88rem;max-width:95ch}.imp-warn ul{margin:6px 0 6px 18px;padding:0}
.imp-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
body.dropping::after{content:'Drop judgement or project files (.json) to import them';position:fixed;inset:12px;z-index:1000;pointer-events:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;border:2px dashed var(--accent);border-radius:var(--r);background:color-mix(in srgb,var(--accent-soft) 85%,transparent);color:var(--accent);font-weight:600;font-size:1.05rem}
.levelbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg .seg-k{font-size:.78rem;color:var(--muted);padding:0 10px 0 8px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font-size:.88rem;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
.seg button:not(.on):hover{background:var(--surface-2)}
.xa-list{list-style:none;padding:0;margin:6px 0 0;font-size:.88rem;display:grid;gap:2px}
.drawer .dhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.drawer h3{font-size:1.2rem;overflow-wrap:anywhere}
.drawer .stats.tight{grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.drawer .stat{padding:8px 10px}
.drawer .stat .v{font-size:1.1rem}
.bd-h{margin-top:18px}
.bd-dim{border-top:1px solid var(--line-2);margin-top:16px}
.bd-table{font-size:.82rem;margin-top:4px}
.bd-table td,.bd-table th{padding:5px 6px}
.rlegend{display:flex;gap:16px;margin-top:10px;font-size:.8rem;color:var(--muted)}
.rlegend .lk{display:inline-block;width:18px;height:0;vertical-align:middle;margin-right:6px}
.rlegend .lk.tract{border-top:2px solid var(--accent)} .rlegend .lk.med{border-top:2px dashed var(--muted)}
svg.radar{display:block;width:100%;max-width:420px;margin:4px auto 0}
svg.radar .rtract{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
svg.radar .rtract-l{stroke:var(--accent);stroke-width:2}
svg.radar .rmed{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
svg.radar .rmed-t{stroke:var(--ink-2);stroke-width:2;stroke-dasharray:3 2}
svg.radar .rdot{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
svg.radar .rbar{fill:var(--accent)}
svg.radar .rhit{fill:transparent;cursor:default}
svg.radar text.rtick{font-size:9px}
svg.radar text.na{font-style:italic;opacity:.75}
@media (max-width:560px){.drawer{padding:14px 16px 28px} .bd-table .bd-med{display:none}}
.tooltip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--ground);padding:7px 10px;border-radius:6px;font-size:.8rem;line-height:1.4;max-width:260px;box-shadow:var(--shadow)}
.progress{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .2s}

.empty{padding:36px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{max-width:56ch;color:var(--muted)}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;width:100%;max-width:980px;text-align:left}
.start{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.start:hover{border-color:var(--accent)}
.start .t{font-family:var(--font-cond);font-weight:600;font-size:1.02rem}
.start p{color:var(--muted);font-size:.88rem}

.guide{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:900px}
.guide p,.guide li{max-width:72ch}
.guide ol,.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.formula{font-family:var(--font-mono);font-size:.88rem;background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;overflow-x:auto;white-space:pre}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:8px;font-size:.88rem;box-shadow:var(--shadow);z-index:30;max-width:calc(100% - 32px)}
.copybox{width:100%;min-height:140px;font-family:var(--font-mono);font-size:.78rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
@media (max-width:860px){.mapwrap{grid-template-columns:1fr}}
.mapbox{position:relative;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden;background:var(--surface)}
.mapbox.active{border-color:var(--accent-line)}
svg.map{display:block;width:100%;height:auto;cursor:grab;-webkit-user-select:none;user-select:none}
svg.map.dragging{cursor:grabbing}
.mapbox.active svg.map{touch-action:none}
svg.map path.u:hover{stroke:var(--ink);stroke-width:1.6}
.mapctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;font-size:1rem;line-height:1;display:grid;place-items:center;padding:0}
.mapctl button:hover{background:var(--surface-2)}
.maphint{position:absolute;left:8px;top:8px;font-size:.72rem;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:2px 7px;border-radius:4px;pointer-events:none}
.mapbox.active .maphint{display:none}
#results-table tbody tr{cursor:pointer}
#results-table tbody tr:hover td{background:var(--surface-2)}

  <section class="panel stack"><h2>Saaty's fundamental scale</h2>
    <div class="tscroll"><table class="data"><thead><tr><th class="r">Value</th><th>Meaning</th></tr></thead><tbody>
      <tr><td class="r num">1</td><td>Equal importance</td></tr><tr><td class="r num">3</td><td>Moderate importance of one over the other</td></tr><tr><td class="r num">5</td><td>Strong importance</td></tr><tr><td class="r num">7</td><td>Very strong importance</td></tr><tr><td class="r num">9</td><td>Extreme importance</td></tr><tr><td class="r num">2, 4, 6, 8</td><td>Between the neighbouring judgements</td></tr><tr><td class="r num">1/3 … 1/9</td><td>The reverse comparison (picked on the other side of the scale)</td></tr></tbody></table></div></section>
  <section class="panel stack"><h2>Formulas</h2>
    <div class="formula">Pairwise matrix       A = [a_ij],  a_ji = 1 / a_ij,  n(n−1)/2 judgements
RGMM priorities       w_i = (Π_j a_ij)^(1/n) / Σ_k (Π_j a_kj)^(1/n)
Eigenvector           A w = λmax w
Consistency           CI = (λmax − n) / (n − 1),   CR = CI / RI(n),   accept CR &lt; 0.10
                      RI: n=3 0.58 · 4 0.90 · 5 1.12 · 6 1.24 · 7 1.32 · 8 1.41 · 9 1.45 · 10 1.49

Group (AIJ)           a_ij^G = Π_k a_ij,k^(λ_k / Σλ)     (weighted geometric mean)
Group (AIP)           w_i^G ∝ Π_k w_i,k^(λ_k / Σλ)
Global weight         w_j = w_d × w_j|d
Pillar weight         w_j^P = w_j / Σ_(k∈P) w_k              (P = EO or AP)
Normalise             x' = f + (1 − f)·(x − min)/(max − min)     (flipped for ↓ indicators; min and max over
                      tracts with at least the minimum number of residents)
Pillar score          EO_i = 100 · Π_(j∈EO) x'_ij ^ w_j^P     (AP_i likewise)
Index                 ARI_i = √(EO_i · AP_i)
Gap (choose one)      standardised  G_i = z(EO_i) − z(AP_i),  z = (x − mean) / sd over the study area   (default)
                      percentile    G_i = pct(EO_i) − pct(AP_i),  pct = 100 (rank − 1) / (n − 1)
                      raw           G_i = EO_i − AP_i   (proposal; mostly reflects how indicators are spread)
Gap label             from the terciles of EO and AP (low = bottom third):
                      EO-limited  EO low, AP not  ·  AP-limited  AP low, EO not  ·  Both low
                      Ready  both in the top third  ·  Mid-range  the rest
Agreement             Kendall's W = 12 S / (m² (n³ − n))</div></section>
  <section class="panel stack"><h2>Good practice for the group</h2>
    <ul>
      <li>Agree definitions of each dimension and indicator before anyone compares; write them in the description fields.</li>
      <li>Lock the hierarchy once comparisons start. Adding an element later leaves everyone with new unanswered pairs.</li>
      <li>Revise any matrix with CR above 0.10 using the suggestions, rather than accepting it.</li>
      <li>Record a short rationale for each comparison set; the rationales are included in the consistency report.</li>
      <li>Report both the pooled weights and Kendall's W so readers can see how much the group agreed.</li>
    </ul></section></div>`;
